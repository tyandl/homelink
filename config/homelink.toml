# homelink configuration
#
# Non-sensitive settings only. Credentials and secrets must be set via
# environment variables (YOLINK_CLIENT_ID, YOLINK_CLIENT_SECRET,
# FRIGATE_USER, FRIGATE_PASSWORD, WEBHOOK_SECRET).
#
# Mount this directory into the container at /config:
#   volumes:
#     - ./config:/config:ro
#
# Each [[rules]] entry binds one trigger (a device event on some service) to
# one or more actions (something to do on some service, possibly a
# different one). Only the services actually referenced below are ever
# connected to: a service with no [[rules]] trigger never subscribes or
# polls, and a service with no [[rules]] action never gets a client built.

[yolink]
# [yolink] itself takes no fields -- cloud and Local Hub settings are
# genuinely disjoint (nothing is meaningful in both modes), so it's just
# the namespace [yolink.cloud]/[yolink.local] live under. Exactly one of
# the two sub-tables may be present; combining them is a config load
# error. Neither is required: with no [yolink.cloud]/[yolink.local] at
# all, cloud with the default endpoints is used.

[yolink.cloud]
# Optional overrides of the production cloud endpoints, only needed to
# point at a different cloud environment (e.g. staging).
api_host    = "https://api.yosmart.com"
mqtt_broker = "tcp://mqtt.api.yosmart.com:8003"

# To connect to a Local Hub on the LAN instead of the cloud, remove
# [yolink.cloud] above and use [yolink.local] instead. A Local Hub broker
# uses a different auth scheme and topic layout than cloud entirely
# (client ID/secret, not a token; ylsubnet/ topics, not yl-home/),
# handled automatically once you connect this way.
#
# [yolink.local]
# host      = "192.168.1.50"  # the hub's LAN address
# net_id    = "C00295"        # YoLink app: hub details -> "Net Id" (not available via the API)
# http_port = 1080             # optional, default 1080
# mqtt_port = 18080            # optional, default 18080

[frigate]
base_url = "http://frigate:5000"

[kasa]
# Base URL of the kasa-agent sidecar (see docker-compose.yml).
agent_base_url = "http://kasa-agent:8090"

# No device list here: `device` in [[rules.actions]] below is the exact
# name set in the Kasa app (e.g. "Porch Light"). kasa-agent resolves that
# name to an IP itself, by scanning its configured subnet
# (KASA_SCAN_SUBNET) and reading each device's self-reported alias -- see
# docker-compose.yml for the agent's scan/refresh/retry settings.

[server]
port      = 8080
log_level = "warn"

# Trigger event vocabulary (service = "yolink"):
#   door.opened, door.closed       (DoorSensor)
#   leak.detected, leak.dry        (LeakSensor)
#   lock.unlocked, lock.locked     (Lock, LockV2)
#   motion.detected, motion.clear  (MotionSensor)
#
# Trigger event vocabulary (service = "timer"):
#   expired       device = the timer's name, set via a timer "set" action
#   time_of_day   device = an arbitrary label for this schedule; also needs
#                 `at = "HH:MM"` (24-hour, local time — set the TZ env var)
#
# Action verbs (service = "frigate"):
#   create_event   (fields: label, sub_label, duration, bounding_box,
#                   pre_capture, include_recording)
#
# Action verbs (service = "kasa"):
#   turn_on, turn_off, toggle, set_brightness (needs `brightness`, 0-100),
#   led_on, led_off
#
# Action verbs (service = "timer"):
#   set     device = timer name, needs `duration` (Go syntax: "5m", "1h30m")
#   cancel  device = timer name; no-op if that timer isn't running

# [[rules]]
# name = "mailbox opened"
#
# [rules.trigger]
# service = "yolink"
# device  = "Mailbox Sensor"   # exact name from the YoLink app
# event   = "door.opened"
#
# [[rules.actions]]
# service       = "frigate"
# device        = "Street Camera"  # Frigate camera name
# action        = "create_event"
# label         = "mail"
# sub_label     = "mailbox"
# duration      = 30
# bounding_box  = [0.0, 0.0, 1.0, 1.0]  # [x, y, dx, dy], 0.0-1.0
#
# [[rules.actions]]
# service = "kasa"
# device  = "Porch Light"          # exact name from the Kasa app
# action  = "turn_on"
#
# [[rules.actions]]
# service  = "timer"
# device   = "mailbox lit"         # arbitrary timer name
# action   = "set"
# duration = "5m"
#
# [[rules]]
# name = "mailbox light timeout"
#
# [rules.trigger]
# service = "timer"
# device  = "mailbox lit"          # matches the "set" action's device above
# event   = "expired"
#
# [[rules.actions]]
# service = "kasa"
# device  = "Porch Light"
# action  = "turn_off"
#
# [[rules]]
# name = "porch light at 4pm"
#
# [rules.trigger]
# service = "timer"
# device  = "afternoon"            # arbitrary schedule label
# event   = "time_of_day"
# at      = "16:00"
#
# [[rules.actions]]
# service = "kasa"
# device  = "Porch Light"
# action  = "turn_on"
